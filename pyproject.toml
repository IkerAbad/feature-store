[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "incremental-feature-store"
version = "0.1.0"
description = "Incremental, point-in-time-correct financial features with count and time windows, restart checkpoints and a versioned Parquet backend."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Iker Abad" }]
keywords = [
    "feature store",
    "incremental computation",
    "point-in-time",
    "streaming",
    "time windows",
    "checkpoints",
    "quantitative finance",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/IkerAbad/feature-store"
Repository = "https://github.com/IkerAbad/feature-store"
Issues = "https://github.com/IkerAbad/feature-store/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
feature_store = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true
warn_return_any = true
warn_redundant_casts = true
warn_unused_configs = true
show_error_codes = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["feature_store"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
